<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>обнимяяяв 🫂</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe0ee;--bg2:#ffb6d5;--bg3:#ff8fbd;--ink:#7a1f4d;--acc:#ff4f93;--card:rgba(255,255,255,.62);--sh:rgba(255,79,147,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1028;--bg2:#5a1840;--bg3:#7a2257;--ink:#ffd9e8;--card:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg1:#3a1028;--bg2:#5a1840;--bg3:#7a2257;--ink:#ffd9e8;--card:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));background-size:300% 300%;animation:bgm 14s ease infinite;overflow:hidden}
@keyframes bgm{50%{background-position:100% 100%}}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#bg span{position:absolute;bottom:-50px;animation:rise linear infinite;opacity:.6}
@keyframes rise{to{transform:translateY(-120vh) rotate(60deg) scale(1.3);opacity:0}}
.hub{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh}
h1{margin:0;font-family:'Pacifico','Brush Script MT',cursive;font-weight:400;font-size:clamp(44px,15vw,130px);color:var(--acc);display:flex;cursor:pointer;text-shadow:0 8px 26px var(--sh);user-select:none}
h1 span{display:inline-block;animation:wave 2.2s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
h1 span.y{animation-name:stretch}
@keyframes wave{50%{transform:translateY(-14px) rotate(-4deg)}}
@keyframes stretch{50%{transform:translateY(-10px) scaleY(1.35) scaleX(.9)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(12px,3vw,28px);width:min(92vw,720px)}
.tile{position:relative;width:clamp(76px,22vw,130px);aspect-ratio:1;border:0;border-radius:32%;font-size:clamp(34px,10vw,58px);background:var(--card);backdrop-filter:blur(10px);box-shadow:0 12px 30px var(--sh),inset 0 0 0 2px rgba(255,255,255,.6);cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1);animation:bob 3s ease-in-out infinite;animation-delay:calc(var(--i)*.4s)}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
.tile:hover{transform:scale(1.15) rotate(-6deg)}
.tile:active{transform:scale(.92)}
.tile.ok::after{content:'✅';position:absolute;right:-6px;top:-6px;font-size:.45em;animation:pp .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pp{from{transform:scale(0)}}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,120,175,.35);backdrop-filter:blur(14px);z-index:10}
#ov.on{display:flex;animation:fin .3s}
@keyframes fin{from{opacity:0}}
#box{position:relative;padding:16px;border-radius:30px;background:var(--card);backdrop-filter:blur(12px);box-shadow:0 20px 50px var(--sh),inset 0 0 0 2px rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;gap:12px;animation:zoom .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes zoom{from{transform:scale(.5) rotate(-8deg);opacity:0}}
#x{position:absolute;top:-16px;right:-12px;width:42px;height:42px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 6px 14px var(--sh);z-index:3}
.hud{font-size:22px;letter-spacing:2px;min-height:30px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(86vw,340px)}
.c{position:relative;aspect-ratio:1;border:0;padding:0;background:none;perspective:500px;cursor:pointer}
.c i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:20%;backface-visibility:hidden;transition:transform .45s;font-style:normal;font-size:clamp(26px,9vw,40px)}
.c .f{background:linear-gradient(135deg,#ff4f93,#ff9ac1);box-shadow:0 5px 12px var(--sh);color:#fff}
.c .b{background:#fff;transform:rotateY(180deg)}
.c.o .f{transform:rotateY(-180deg)}.c.o .b{transform:rotateY(0)}
.c.m .b{animation:mt .6s}
@keyframes mt{40%{transform:scale(1.25) rotate(12deg)}}
canvas{width:min(86vw,320px);aspect-ratio:1;border-radius:24px;background:rgba(255,255,255,.55);touch-action:none;box-shadow:inset 0 0 0 2px rgba(255,79,147,.5)}
.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,50px);gap:6px}
.pad button{border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 5px 12px var(--sh)}
.pad button:active{transform:scale(.9)}
.won{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;z-index:2;animation:won 1.1s ease-out forwards;pointer-events:none}
@keyframes won{0%{transform:scale(0) rotate(-30deg)}50%{transform:scale(1.4) rotate(8deg)}100%{transform:scale(1)}}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.conf{position:fixed;top:-40px;z-index:30;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(115vh) rotate(540deg)}}
#fin{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4vh;background:radial-gradient(circle,var(--bg1),var(--bg3))}
#fin.on{display:flex;animation:fin .8s}
#fin h1{font-size:clamp(46px,17vw,160px);animation:grow 2.4s ease-in-out infinite}
@keyframes grow{50%{transform:scale(1.1) rotate(-2deg)}}
#fin .big{font-size:clamp(70px,22vw,180px);animation:beat 1s infinite}
@keyframes beat{15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
#re{border:0;border-radius:50%;width:60px;height:60px;font-size:28px;background:var(--card);cursor:pointer;box-shadow:0 8px 20px var(--sh)}
.playfield{position:relative;width:min(86vw,340px);height:min(68vh,390px);min-height:260px;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.9),rgba(255,210,230,.48));box-shadow:inset 0 0 0 2px rgba(255,79,147,.35);touch-action:manipulation}
.orb{position:absolute;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;box-shadow:0 7px 18px rgba(255,79,147,.28);animation:orbfloat 2.2s ease-in-out infinite alternate;transition:transform .18s}
@keyframes orbfloat{to{transform:translateY(-12px) rotate(18deg)}}
.star-dot{position:absolute;width:35px;height:35px;border:2px solid white;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,#ff8fbd 40%,#ff4f93 75%);box-shadow:0 0 18px #ff4f93;transform:translate(-50%,-50%);cursor:pointer}
.star-dot.hit{background:#fff;box-shadow:0 0 24px #fff,0 0 35px #ff4f93;pointer-events:none}
.garden{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(86vw,330px)}
.garden button{aspect-ratio:1;border:0;border-radius:24px;background:rgba(255,255,255,.55);font-size:clamp(34px,10vw,54px);box-shadow:0 7px 16px var(--sh);cursor:pointer;transition:transform .25s}
.garden button:active{transform:scale(.86)}
.garden button.bloom{animation:bloom .55s cubic-bezier(.2,1.8,.4,1);background:rgba(255,255,255,.9)}
@keyframes bloom{50%{transform:scale(1.18) rotate(12deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}#bg{display:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<main class="hub">
  <h1 id="w" aria-label="обнимяяяв"></h1>
  <div class="tiles">
    <button class="tile" data-g="m" style="--i:0" aria-label="память">🧸</button>
    <button class="tile" data-g="s" style="--i:1" aria-label="змейка">💗</button>
    <button class="tile" data-g="r" style="--i:2" aria-label="ритм">🎯</button>
    <button class="tile" data-g="c" style="--i:3" aria-label="созвездие">🌌</button>
    <button class="tile" data-g="b" style="--i:4" aria-label="пузырьки">🫧</button>
    <button class="tile" data-g="o" style="--i:5" aria-label="орбита">🪐</button>
    <button class="tile" data-g="f" style="--i:6" aria-label="сад цветов">🌷</button>
    <button class="tile" data-g="p" style="--i:7" aria-label="ловец звёзд">🌠</button>
    <button class="tile" data-g="v" style="--i:8" aria-label="цветовой код">🎨</button>
    <button class="tile" data-g="l" style="--i:9" aria-label="лабиринт">🌀</button>
    <button class="tile" data-g="q" style="--i:10" aria-label="реакция">⚡</button>
    <button class="tile" data-g="a" style="--i:11" aria-label="ритм сердец">💓</button>
    <button class="tile" data-g="z" style="--i:12" aria-label="поймай котика">🐈</button>
    <button class="tile" data-g="t" style="--i:13" aria-label="мозаика">🧩</button>
    <button class="tile" data-g="d" style="--i:14" aria-label="рисунок">🖌️</button>
    <button class="tile" data-g="h" style="--i:15" aria-label="луна">🌙</button>
    <button class="tile" data-g="e" style="--i:16" aria-label="лазер">🔮</button>
    <button class="tile" data-g="u" style="--i:17" aria-label="символы">🔐</button>
  </div>
</main>
<div id="ov"><div id="box"></div></div>
<div id="fin"><h1 id="w2"></h1><div class="big">🫂</div><button id="re" aria-label="заново">🔁</button></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var E=['💗','💖','🌸','🧸','🎀','🦋','🍓','✨'];
var bg=$('#bg');
for(var i=0;i<22;i++){var s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=Math.random()*100+'%';s.style.fontSize=(16+Math.random()*34)+'px';s.style.animationDuration=(8+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*14)+'s';bg.appendChild(s)}
function word(el){var t='обнимяяяв';el.innerHTML='';for(var i=0;i<t.length;i++){var s=document.createElement('span');s.textContent=t[i];s.style.setProperty('--i',i);if(i>=4&&i<=6)s.className='y';el.appendChild(s)}}
word($('#w'));word($('#w2'));
function conf(n){for(var i=0;i<(n||40);i++){var c=document.createElement('div');c.className='conf';c.textContent=E[i%E.length];c.style.left=Math.random()*100+'vw';c.style.fontSize=(20+Math.random()*30)+'px';c.style.animationDuration=(2.5+Math.random()*2.5)+'s';c.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(c);setTimeout(function(x){x.remove()},7000,c)}}
$('#w').onclick=function(){conf(18)};

var done={m:0,s:0,r:0,c:0,b:0,o:0,f:0,p:0,v:0,l:0,q:0,a:0,z:0,t:0,d:0,h:0,e:0,u:0},stop=null,ov=$('#ov'),box=$('#box');
function open(k){box.innerHTML='<button id="x" aria-label="закрыть">✕</button>';$('#x').onclick=close;ov.classList.add('on');stop=G[k](box,function(){win(k)})}
function close(){if(stop)stop();stop=null;ov.classList.remove('on')}
function win(k){if(stop)stop();stop=null;done[k]=1;box.insertAdjacentHTML('beforeend','<div class="won">🫂</div>');conf(50);
  setTimeout(function(){close();document.querySelector('[data-g='+k+']').classList.add('ok');if(Object.keys(done).every(function(key){return done[key]})){$('#fin').classList.add('on');conf(120);setInterval(function(){conf(8)},1500)}},1400)}
document.querySelectorAll('.tile').forEach(function(t){t.onclick=function(){open(t.dataset.g)}});
$('#re').onclick=function(){location.reload()};

var G={};
/* память */
G.m=function(box,w){
  var h=document.createElement('div');h.className='hud';h.textContent='🤍🤍🤍🤍🤍🤍';box.appendChild(h);
  var g=document.createElement('div');g.className='grid';box.appendChild(g);
  var a=E.slice(0,6).concat(E.slice(0,6)).sort(function(){return Math.random()-.5}),first=null,lock=false,found=0;
  a.forEach(function(e){var b=document.createElement('button');b.className='c';b.innerHTML='<i class="f">💞</i><i class="b">'+e+'</i>';b.dataset.e=e;
    b.onclick=function(){if(lock||b.classList.contains('o'))return;b.classList.add('o');
      if(!first){first=b;return}
      if(first.dataset.e===e){first.classList.add('m');b.classList.add('m');first=null;found++;h.textContent='💗'.repeat(found)+'🤍'.repeat(6-found);if(found===6)setTimeout(w,500)}
      else{lock=true;var f=first;first=null;setTimeout(function(){f.classList.remove('o');b.classList.remove('o');lock=false},800)}};
    g.appendChild(b)});
  return function(){}
};
/* змейка */
G.s=function(box,w){
  var N=15,C=20,sn=[{x:7,y:7}],d={x:1,y:0},nd=d,sc=0,fd,GOAL=10;
  var h=document.createElement('div');h.className='hud';box.appendChild(h);
  var cv=document.createElement('canvas');cv.width=cv.height=N*C;box.appendChild(cv);
  var x=cv.getContext('2d');
  var pad=document.createElement('div');pad.className='pad';
  pad.innerHTML='<span></span><button data-d="u">▲</button><span></span><button data-d="l">◀</button><button data-d="d">▼</button><button data-d="r">▶</button>';box.appendChild(pad);
  var M={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}};
  function turn(v){if(v.x!==-d.x||v.y!==-d.y)nd=v}
  pad.querySelectorAll('button').forEach(function(b){b.onclick=function(){turn(M[b.dataset.d])}});
  function key(e){var m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m){turn(M[m]);e.preventDefault()}}
  document.addEventListener('keydown',key);
  var sx,sy;cv.onpointerdown=function(e){sx=e.clientX;sy=e.clientY};
  cv.onpointerup=function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)<20)return;turn(Math.abs(dx)>Math.abs(dy)?(dx>0?M.r:M.l):(dy>0?M.d:M.u))};
  function food(){do{fd={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(sn.some(function(p){return p.x===fd.x&&p.y===fd.y}))}
  function hud(){h.textContent='💗'.repeat(sc)+'🤍'.repeat(GOAL-sc)}
  food();hud();var t0=0;
  function draw(){x.clearRect(0,0,N*C,N*C);x.textAlign='center';x.textBaseline='middle';
    var p=1+Math.sin(Date.now()/150)*.15;x.font=(18*p)+'px serif';x.fillText('💗',fd.x*C+C/2,fd.y*C+C/2+1);
    sn.forEach(function(s,i){if(i===sn.length-1){x.font='20px serif';x.fillText('🧸',s.x*C+C/2,s.y*C+C/2+1)}else{x.fillStyle='hsl('+(335+i*4)+',90%,'+(65+i%3*4)+'%)';x.beginPath();x.arc(s.x*C+C/2,s.y*C+C/2,C/2-1,0,7);x.fill()}})}
  function tick(){d=nd;var hd={x:(sn[sn.length-1].x+d.x+N)%N,y:(sn[sn.length-1].y+d.y+N)%N};
    if(sn.some(function(p){return p.x===hd.x&&p.y===hd.y})){sn=[hd];cv.classList.remove('shake');void cv.offsetWidth;cv.classList.add('shake');return}
    sn.push(hd);if(hd.x===fd.x&&hd.y===fd.y){sc++;hud();food();if(sc>=GOAL){draw();w();return}}else sn.shift()}
  var iv=setInterval(function(){tick()},140),raf;(function L(){draw();raf=requestAnimationFrame(L)})();
  return function(){clearInterval(iv);cancelAnimationFrame(raf);document.removeEventListener('keydown',key)}
};
/* ритм */
G.r=function(box,w){
  var h=document.createElement('div');h.className='hud';box.appendChild(h);
  var cv=document.createElement('canvas');cv.width=cv.height=300;box.appendChild(cv);var x=cv.getContext('2d');
  var R0=40,TOL=15,r=140,p=0,wait=0,last=performance.now(),raf,ps=[],GOAL=8,spd=95;
  function hud(){h.textContent='⭐'.repeat(p)+'☆'.repeat(GOAL-p)}hud();
  function burst(e){for(var i=0;i<10;i++){var a=Math.random()*6.28;ps.push({x:150,y:150,vx:Math.cos(a)*(80+Math.random()*120),vy:Math.sin(a)*(80+Math.random()*120),l:1,e:e})}}
  function miss(){p=Math.max(0,p-1);hud();burst('💔');cv.classList.remove('shake');void cv.offsetWidth;cv.classList.add('shake')}
  function reset(){r=140;wait=.5;spd=95+p*9}
  function tap(){if(wait>0)return;if(Math.abs(r-R0)<=TOL){p++;hud();burst('💗');burst('✨');if(p>=GOAL){w();return}}else miss();reset()}
  cv.onpointerdown=function(e){e.preventDefault();tap()};
  function key(e){if(e.code==='Space'){e.preventDefault();tap()}}document.addEventListener('keydown',key);
  function L(t){var dt=Math.min((t-last)/1000,.05);last=t;
    if(wait>0)wait-=dt;else{r-=spd*dt;if(r<=0){miss();reset()}}
    x.clearRect(0,0,300,300);
    var pu=1+Math.sin(t/180)*.12;
    x.beginPath();x.arc(150,150,R0,0,7);x.lineWidth=TOL*2;x.strokeStyle='rgba(255,143,189,.35)';x.stroke();
    x.beginPath();x.arc(150,150,R0,0,7);x.lineWidth=2;x.setLineDash([6,6]);x.strokeStyle='#ff4f93';x.stroke();x.setLineDash([]);
    if(wait<=0){x.beginPath();x.arc(150,150,Math.max(r,1),0,7);x.lineWidth=8;x.strokeStyle=Math.abs(r-R0)<=TOL?'#ff1f7a':'#ff7fb3';x.stroke()}
    x.textAlign='center';x.textBaseline='middle';x.font=(34*pu)+'px serif';x.fillText('🧸',150,152);
    ps=ps.filter(function(q){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt*1.4;if(q.l>0){x.globalAlpha=q.l;x.font='22px serif';x.fillText(q.e,q.x,q.y)}return q.l>0});x.globalAlpha=1;
    raf=requestAnimationFrame(L)}
  raf=requestAnimationFrame(L);
  return function(){cancelAnimationFrame(raf);document.removeEventListener('keydown',key)}
};

/* созвездие: соединить мерцающие звёзды по порядку */
G.c=function(box,w){
  var h=document.createElement('div');h.className='hud';box.appendChild(h);
  var field=document.createElement('div');field.className='playfield';box.appendChild(field);
  var pts=[[18,22],[48,13],[78,25],[27,49],[62,48],[43,78],[83,76]],n=0,lines=[];
  h.textContent='✨ 0 / '+pts.length;
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');
  svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
  field.appendChild(svg);
  pts.forEach(function(p,i){
    var d=document.createElement('button');d.className='star-dot';d.style.left=p[0]+'%';d.style.top=p[1]+'%';d.setAttribute('aria-label','звезда '+(i+1));
    d.onclick=function(){
      if(i!==n){d.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:'translate(-50%,-50%) scale(.7)'},{transform:'translate(-50%,-50%) scale(1)'}],250);return}
      d.classList.add('hit');n++;h.textContent='✨ '+n+' / '+pts.length;
      if(n>1){var prev=pts[n-2],line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',prev[0]);line.setAttribute('y1',prev[1]);line.setAttribute('x2',p[0]);line.setAttribute('y2',p[1]);line.setAttribute('stroke','#ff4f93');line.setAttribute('stroke-width','1.4');line.setAttribute('stroke-linecap','round');svg.appendChild(line)}
      if(n===pts.length)w();
    };field.appendChild(d);
  });
  return function(){};
};
/* лопни все пузырьки до того, как они улетят */
G.b=function(box,w){
  var h=document.createElement('div');h.className='hud';box.appendChild(h);
  var field=document.createElement('div');field.className='playfield';box.appendChild(field);
  var score=0,goal=18,live=true,items=[],raf,last=performance.now();
  function hud(){h.textContent='🫧 '+score+' / '+goal}hud();
  function spawn(){
    var b=document.createElement('button');b.className='orb';b.textContent=['💗','🌸','✨','🍓','🦋'][Math.floor(Math.random()*5)];
    var size=34+Math.random()*28,x=4+Math.random()*82,y=105;
    b.style.width=size+'px';b.style.height=size+'px';b.style.left=x+'%';b.style.top=y+'%';b.style.fontSize=(size*.58)+'px';
    var item={el:b,x:x,y:y,v:.22+Math.random()*.2};items.push(item);
    b.onclick=function(){if(!live)return;score++;hud();b.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.8)',opacity:0}],180);setTimeout(function(){b.remove()},170);item.dead=true;if(score>=goal){live=false;w()}};
    field.appendChild(b);
  }
  for(var i=0;i<7;i++)spawn();
