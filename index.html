<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Flower Morph — Endless Bloom</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:16px;background:#03040a;color:#eaf0ff;font-family:Consolas,Monaco,monospace;display:grid;place-items:center}
.app{width:min(1080px,100%)}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 4px 14px;color:#93a3bf;font-size:12px;letter-spacing:.14em}
.brand{font-weight:bold;color:#fff;letter-spacing:.2em}
.live{color:#8de5c1}
.stage{height:min(70vh,720px);min-height:430px;position:relative;overflow:hidden;border:1px solid #202b40;border-radius:16px;background:radial-gradient(ellipse at 50% 48%,#171b32,#070912 56%,#010205);box-shadow:0 20px 80px #000}
canvas{width:100%;height:100%;display:block}
.tag,.hint,.counter{position:absolute;color:#8492b2;font-size:10px;letter-spacing:.13em;pointer-events:none}
.tag{top:16px;right:18px}.hint{bottom:15px;left:17px}.counter{top:16px;left:18px}
.panel{margin-top:13px;background:#0c111c;border:1px solid #263147;border-radius:12px;overflow:hidden}
.bar{background:#171e2c;padding:11px 14px;color:#b7c3d8;font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;padding:14px;align-items:center;font-size:12px;color:#d2d9e7}
label{display:flex;align-items:center;gap:7px}input{width:105px;accent-color:#a18bff}
select,button{background:#1a2435;color:#eaf0ff;border:1px solid #394760;border-radius:7px;padding:8px 10px;font:inherit}
button{cursor:pointer}button:hover{background:#283650}
.timeline{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 14px}
.flower-chip{font-size:10px;color:#8391ad;border:1px solid #29364d;border-radius:20px;padding:5px 9px;transition:.3s}
.flower-chip.active{color:#fff;border-color:#a58cff;background:#5c4c9b55;box-shadow:0 0 18px #8c70ff33}
footer{text-align:center;color:#65728a;font-size:11px;padding:13px}
@media(max-width:600px){body{padding:8px}.stage{height:65vh;min-height:390px}.hint{font-size:8px}.controls{gap:12px}}
</style>
</head>
<body>
<div class="app">
<header><span class="brand">ASCII / FLOWER MORPH</span><span class="live">● ENDLESS BLOOM</span></header>
<div class="stage">
<canvas id="c"></canvas>
<div class="tag">PROCEDURAL MORPHING FLOWER</div>
<div class="counter" id="counter">01 / 10</div>
<div class="hint">ДВИГАЙ МЫШЬЮ · ЦВЕТОК ПЛАВНО МЕНЯЕТ ФОРМУ</div>
</div>
<section class="panel">
<div class="bar">● ● ● &nbsp; flower_morph.html — плавное превращение</div>
<div class="controls">
<label>Скорость <input id="speed" type="range" min=".15" max="2.5" step=".05" value=".7"></label>
<label>Детализация <input id="density" type="range" min="5" max="14" value="8"></label>
<label>Цвет <select id="palette"><option value="natural">Цвета цветов</option><option value="rainbow">Радуга</option><option value="neon">Неон</option><option value="mono">Монохром</option></select></label>
<label>Длительность <select id="duration"><option value="5">5 секунд</option><option value="8" selected>8 секунд</option><option value="12">12 секунд</option><option value="18">18 секунд</option></select></label>
<button id="pause">Пауза</button><button id="next">Следующий</button><button id="reset">Сначала</button>
</div>
<div class="timeline" id="timeline"></div>
</section>
<footer>10 форм цветов · плавная интерполяция геометрии · бесконечный цикл · один HTML-файл</footer>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const TYPES=[
 {name:'Роза',en:'ROSE',color:[238,65,116]},
 {name:'Тюльпан',en:'TULIP',color:[245,83,105]},
 {name:'Ромашка',en:'DAISY',color:[245,225,178]},
 {name:'Подсолнух',en:'SUNFLOWER',color:[255,177,38]},
 {name:'Лилия',en:'LILY',color:[232,155,210]},
 {name:'Лотос',en:'LOTUS',color:[245,137,190]},
 {name:'Орхидея',en:'ORCHID',color:[177,112,244]},
 {name:'Пион',en:'PEONY',color:[246,112,166]},
 {name:'Мак',en:'POPPY',color:[244,65,61]},
 {name:'Хризантема',en:'MUM',color:[255,181,80]}
];
const chars=' .,:;irsXA253hMHGS#9B&@';
const PETALS=12, A=18, B=9, LAYERS=3;
let W=0,H=0,angle=0,paused=false,last=0,mx=0,my=0,tx=0,ty=0;
let current=0,nextIndex=1,elapsed=0,pointsA=[],pointsB=[],stars=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
function add(arr,x,y,z,nx,ny,nz,type,layer=0,petal=0){
 const n=Math.hypot(nx,ny,nz)||1;arr.push({x,y,z,nx:nx/n,ny:ny/n,nz:nz/n,type,layer,petal});
}
function sphere(arr,cx,cy,cz,rx,ry,rz,rows,cols,type){
 for(let i=0;i<=rows;i++){let v=Math.PI*i/rows,sv=Math.sin(v),cv=Math.cos(v);
  for(let j=0;j<cols;j++){let u=2*Math.PI*j/cols,x=cx+rx*sv*Math.cos(u),y=cy+ry*cv,z=cz+rz*sv*Math.sin(u);
   add(arr,x,y,z,(x-cx)/(rx*rx),(y-cy)/(ry*ry),(z-cz)/(rz*rz),type);
  }
 }
}
function flower(kind){
 const out=[],spec=kind;
 // Три одинаковых по сетке слоя позволяют одной форме мягко перетекать в другую.
 for(let layer=0;layer<LAYERS;layer++){
  const petals=spec===2?12:spec===3?16:spec===6?8:spec===8?7:spec===9?18:12;
  for(let k=0;k<PETALS;k++){
   for(let ai=0;ai<=A;ai++){
    const u=ai/A;
    for(let bi=0;bi<=B;bi++){
     const v=(bi/B-.5)*2;
     const active=k<petals?1:.16;
     const phase=2*Math.PI*k/petals+(layer%2)*.18;
     let r,spread,yy,theta=phase;
     const layerScale=[1,.77,.53][layer];
     if(spec===0){ // Роза: плотные закрученные чашевидные лепестки
      r=(.08+u*.67)*layerScale;spread=(.18+.28*Math.sin(Math.PI*u))*active;
      theta+=v*spread/(Math.max(.2,r));yy=.08+u*.12+.2*v*v-.18*u*u+.06*Math.sin(phase*2+u*8);
     }else if(spec===1){ // Тюльпан: шесть высоких сомкнутых лепестков
      r=(.10+u*.62)*layerScale;spread=(.12+.13*Math.sin(Math.PI*u))*active;
      theta+=v*spread/(Math.max(.2,r));yy=.04+u*.65-.12*v*v-.08*u*u;
     }else if(spec===2){ // Ромашка: длинные узкие лепестки
      r=(.13+u*.83)*layerScale;spread=.105*active;
      theta+=v*spread/(Math.max(.2,r));yy=.04+u*.08+.11*v*v-.12*u*u;
     }else if(spec===3){ // Подсолнух: широкие золотые язычки
      r=(.15+u*.76)*layerScale;spread=.17*active;
      theta+=v*spread/(Math.max(.2,r));yy=.03+u*.2+.07*v*v-.15*u*u;
     }else if(spec===4){ // Лилия: острые, длинные, раскрытые лепестки
      r=(.09+u*.88)*layerScale;spread=(.08+.13*Math.sin(Math.PI*u))*active;
      theta+=v*spread/(Math.max(.2,r));yy=.02+u*.27-.2*Math.pow(Math.abs(v),1.5)+.12*Math.sin(u*Math.PI);
     }else if(spec===5){ // Лотос: плоские округлые слои
      r=(.08+u*.73)*layerScale;spread=.22*active;
      theta+=v*spread/(Math.max(.2,r));yy=.02+u*.08+.06*v*v-.08*u*u;
     }else if(spec===6){ // Орхидея: волнистые широкие лепестки и выступающая губа
      r=(.10+u*.72)*layerScale;spread=.25*active;
      theta+=v*spread/(Math.max(.2,r));yy=.03+u*.12+.1*Math.sin(v*3+phase)+.08*v*v;
     }else if(spec===7){ // Пион: множество округлых взъерошенных слоёв
      r=(.07+u*.68)*layerScale;spread=(.2+.1*Math.sin(u*9+phase))*active;
      theta+=v*spread/(Math.max(.2,r));yy=.05+u*.16+.15*v*v-.12*u*u+.035*Math.sin(u*15+phase*3);
     }else if(spec===8){ // Мак: большие почти плоские волнистые лепестки
      r=(.12+u*.78)*layerScale;spread=.2*active;
      theta+=v*spread/(Math.max(.2,r));yy=.02+u*.03+.08*Math.sin(v*3+phase)-.08*u*u;
     }else{ // Хризантема: много тонких вытянутых лепестков
      r=(.09+u*.8)*layerScale;spread=.075*active;
      theta+=v*spread/(Math.max(.2,r));yy=.03+u*.22+.04*Math.sin(u*12+phase);
     }
     // Дополнительная рябь делает силуэт живым, но без резких скачков.
     const ripple=1+.035*Math.sin(u*13+phase*3+layer);
     r*=ripple;
     const x=r*Math.cos(theta),z=r*Math.sin(theta);
     let y=yy+(.045*Math.sin(phase*3+u*5))*active;
     // Орхидея и мак получают характерные асимметричные лепестки.
     if(spec===6)y+=.12*Math.exp(-Math.pow((k%PETALS-2)/1.7,2))*Math.sin(u*Math.PI);
     if(spec===8)y-=.1*Math.exp(-Math.pow((k%PETALS-1)/1.5,2))*u;
     add(out,x,y,z,Math.cos(theta),.35+u*.3,Math.sin(theta),'petal',layer,k);
    }
   }
  }
 }
 // Центр меняется вместе с видом цветка.
 const centerRadius=spec===3?.27:spec===2?.18:spec===8?.16:.21;
 sphere(out,0,.12,0,centerRadius,.13,centerRadius,12,24,'heart');
 // Стебель и листья имеют одинаковую топологию во всех состояниях.
 for(let i=0;i<100;i++){let t=i/99,y=-1.75+t*1.82;add(out,.035*Math.sin(t*5),y,.025*Math.cos(t*5),.2,0,1,'stem');}
 sphere(out,-.25,-.92,0,.31,.075,.13,10,20,'leaf');
 sphere(out,.25,-1.25,.02,.29,.07,.12,10,20,'leaf');
 // У некоторых цветов добавляем визуальный чашелистик у основания бутона.
 for(let k=0;k<8;k++){let a=k*Math.PI/4;for(let j=0;j<8;j++){let u=j/7,r=.08+u*.36;add(out,r*Math.cos(a),-.02-u*.17,r*Math.sin(a),Math.cos(a),.2,Math.sin(a),'leaf');}}
 return out;
}
function blendPoints(a,b,t){
 const n=Math.min(a.length,b.length),out=new Array(n);
 for(let i=0;i<n;i++){let p=a[i],q=b[i];out[i]={x:mix(p.x,q.x,t),y:mix(p.y,q.y,t),z:mix(p.z,q.z,t),
  nx:mix(p.nx,q.nx,t),ny:mix(p.ny,q.ny,t),nz:mix(p.nz,q.nz,t),type:p.type,layer:p.layer,petal:p.petal};}
 return out;
}
function updateLabels(){
 $('counter').textContent=String(current+1).padStart(2,'0')+' / '+TYPES.length+'  ·  '+TYPES[current].en;
 document.querySelectorAll('.flower-chip').forEach((el,i)=>el.classList.toggle('active',i===current));
}
function makeTimeline(){
 $('timeline').innerHTML='';
 TYPES.forEach((f,i)=>{let el=document.createElement('span');el.className='flower-chip';el.textContent=f.name;el.title='Перейти к форме: '+f.name;el.onclick=()=>jump(i);$('timeline').appendChild(el);});
 updateLabels();
}
function jump(i){current=(i+TYPES.length)%TYPES.length;nextIndex=(current+1)%TYPES.length;elapsed=0;pointsA=flower(current);pointsB=flower(nextIndex);updateLabels();}
function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=canvas.width=Math.floor(r.width*d);H=canvas.height=Math.floor(r.height*d);
 stars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5,a:.12+Math.random()*.45}));}
addEventListener('resize',resize);resize();makeTimeline();jump(0);
function paletteColor(p,light,progress){
 const pal=$('palette').value,base=TYPES[current].color,next=TYPES[nextIndex].color;
 let c=base.map((v,i)=>mix(v,next[i],smooth(progress)));
 if(p.type==='stem'||p.type==='leaf'){
  if(pal==='mono')return `rgba(205,215,230,${.35+light*.55})`;
  return `rgb(${(18+24*light)|0},${(85+125*light)|0},${(35+50*light)|0})`;
 }
 if(p.type==='heart'){c= current===2||current===3?[115,65,24]:[255,190,45];}
 if(pal==='rainbow'){let h=(p.layer*.19+p.petal*.037+progress*.2)%1;let rgb=hsl(h,.88,.57);c=rgb;}
 if(pal==='neon')c=c.map(v=>Math.min(255,v*1.22+25));
 if(pal==='mono')c=[205,215,235];
 const factor=.48+light*.72;
 return `rgb(${c.map(v=>clamp(v*factor,0,255)|0).join(',')})`;
}
function hsl(h,s,l){let a=s*Math.min(l,1-l),f=n=>{let k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));};return [f(0)*255,f(8)*255,f(4)*255];}
function draw(time){
 requestAnimationFrame(draw);
 let dt=Math.min((time-last)/1000||0,.04);last=time;
 if(!paused){
  angle+=dt*+$('speed').value;
  elapsed+=dt;
  const duration=+$('duration').value;
  if(elapsed>=duration){current=nextIndex;nextIndex=(current+1)%TYPES.length;elapsed=0;pointsA=pointsB;pointsB=flower(nextIndex);updateLabels();}
 }
 mx+=(tx-mx)*.045;my+=(ty-my)*.045;
 const duration=+$('duration').value,progress=clamp(elapsed/duration,0,1),morph=smooth(progress);
 const pts=blendPoints(pointsA,pointsB,morph);
 ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);
 for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#b8c9ff';ctx.fillRect(s.x,s.y,s.r,s.r);}
 ctx.globalAlpha=1;
 const cell=+$('density').value*(devicePixelRatio||1);ctx.font=`${cell}px monospace`;ctx.textBaseline='middle';
 const scale=Math.min(W/3.1,H/3.8),yaw=angle+mx*.68,pitch=my*.34,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),buf=new Map();
 for(const p of pts){
  let x=p.x*cy+p.z*sy,z=-p.x*sy+p.z*cy,y=p.y*cp-z*sp,zz=p.y*sp+z*cp,per=4.7/(4.7-zz);
  let sx=W/2+x*scale*per,syy=H/2-y*scale*per;
  if(sx<0||sx>W||syy<0||syy>H)continue;
  let key=Math.round(sx/cell)+','+Math.round(syy/cell),nx=p.nx*cy+p.nz*sy,nz=-p.nx*sy+p.nz*cy,ny=p.ny*cp-nz*sp;
  let light=clamp(.2+Math.max(0,nx*-.4+ny*.7+nz*.65)*.9,.12,1),old=buf.get(key);
  if(!old||zz>old.z){let idx=Math.floor(light*(chars.length-1));buf.set(key,{z:zz,x:Math.round(sx/cell)*cell,y:Math.round(syy/cell)*cell,ch:chars[idx],col:paletteColor(p,light,progress),alpha:.45+light*.55});}
 }
 for(const q of buf.values()){ctx.globalAlpha=q.alpha;ctx.fillStyle=q.col;ctx.fillText(q.ch,q.x,q.y);}
 ctx.globalAlpha=1;
 // Нежное свечение в тон текущего и следующего бутона.
 const c=TYPES[current].color,glow=ctx.createRadialGradient(W/2,H/2,scale*.08,W/2,H/2,scale*1.55);
 glow.addColorStop(0,`rgba(${c.join(',')},.12)`);glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 // Индикатор прогресса превращения.
 ctx.fillStyle='#ffffff22';ctx.fillRect(W*.2,H-13,W*.6,2);
 ctx.fillStyle='#b69cffaa';ctx.fillRect(W*.2,H-13,W*.6*progress,2);
}
requestAnimationFrame(draw);
canvas.addEventListener('pointermove',e=>{let r=canvas.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2;});
canvas.addEventListener('pointerleave',()=>{tx=ty=0;});
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Продолжить':'Пауза';};
$('next').onclick=()=>jump(current+1);
$('reset').onclick=()=>{angle=0;tx=ty=mx=my=0;$('speed').value=.7;$('density').value=8;$('palette').value='natural';$('duration').value='8';paused=false;$('pause').textContent='Пауза';jump(0);};
})();
</script>
</body>
</html>
